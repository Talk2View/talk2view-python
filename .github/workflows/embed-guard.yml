name: Embed page runtime guard

# The built chat page (embed/) inside the official 3D Slicer
# builds whose web view is Chromium 83 (Qt 5.15.2, Linux and Windows), served by the real
# UIServer over talk2view.ui.testing.FakeController. It fails on any probe, any scripted
# step, any uncaught error, or a userAgent that is no longer Chrome/83 (a Slicer on a newer
# Qt retires the Chromium 83 constraint on purpose).
#
# It publishes nothing: the wheel is built as an artifact and installed into a directory of
# this runner's own, never uploaded anywhere, and the job asks for no secrets at all.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "embed/**"
      - "src/talk2view/**"
      - "pyproject.toml"
      - "scripts/check_wheel_assets.py"
      - ".github/workflows/embed-guard.yml"
      - "!embed/**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "embed/**"
      - "src/talk2view/**"
      - "pyproject.toml"
      - "scripts/check_wheel_assets.py"
      - ".github/workflows/embed-guard.yml"
      - "!embed/**/*.md"

permissions:
  contents: read

concurrency:
  group: embed-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pin. Official 3D Slicer 5.12.4 = revision 34645 (Qt 5.15.2 on Linux and Windows ->
  # QtWebEngine on Chromium 83). To move it: fetch
  #   https://download.slicer.org/find?os=linux&revision=<rev>   (and os=win)
  # and copy `download_url` and `sha512` into the matrix below.
  SLICER_VERSION: "5.12.4"
  SLICER_REVISION: "34645"

jobs:
  build:
    name: Build the guard page and the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: embed/package-lock.json

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the page's dependencies
        working-directory: embed
        run: npm ci --no-audit --no-fund

      - name: Build the shipped page and the guard page (both checked for Chromium 83)
        working-directory: embed
        run: |
          npm run build
          npm run build:guard

      - name: Unit tests (the judge)
        working-directory: embed/guard
        run: python3 -m unittest test_guard_judge -v

      - name: Build the talk2view wheel (it carries the shipped page)
        run: |
          uv build --wheel
          python scripts/check_wheel_assets.py dist/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-page
          path: embed/dist-guard
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: talk2view-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  run:
    name: Slicer ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-22.04
            archive: Slicer-5.12.4-linux-amd64.tar.gz
            url: https://download.slicer.org/bitstream/6aa1beb7ce9de556d3010204
            sha512: ac76c5061a8fff20d4e59732855f74360930fd4891450085bcbc6a8eb1a1f4ade9a1ca4fc633142661b714dbe8c4604306079f9546e52053faa5e6f99410cf76
          - label: windows
            os: windows-2022
            archive: Slicer-5.12.4-win-amd64.exe
            url: https://download.slicer.org/bitstream/6aa1db04ce9de556d30112bb
            sha512: 5ba320cb67f0acdaacf0a31380e9cf3b9f46d05f57a53da7e04ebcd9490251ecbe998bfefdbdab1f747e038653177868cdb0ad30986473b9d68efba0f4c6045c
    env:
      ARCHIVE: ${{ matrix.archive }}
      SLICER_URL: ${{ matrix.url }}
      SLICER_SHA512: ${{ matrix.sha512 }}
      T2V_GUARD_LABEL: ${{ matrix.label }}
      T2V_GUARD_EXPECT: "83"
      # Time limits, innermost first: the page's own per-load budget (100 s) -> the driver's
      # deadline (300 s; after the first report it listens 20 s more for a second) -> its
      # hang dump (355 s) -> its watchdog thread, exit 5 (360 s) -> `timeout` / WaitForExit
      # (480 s) -> the step (10 min) -> the job (30 min). The driver's deadline sits far
      # above the page's so that a slow run is reported BY THE PAGE, with its probes and
      # steps in it, rather than as a bare CI timeout.
      T2V_GUARD_TIMEOUT_S: "300"
      T2V_GUARD_OUT: ${{ github.workspace }}/ci-out
      T2V_GUARD_DIST: ${{ github.workspace }}/embed/dist-guard
      T2V_GUARD_SITE: ${{ github.workspace }}/guard-site
      # A hosted runner cannot give Chromium its sandbox. The page is our own, on 127.0.0.1.
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guard-page
          path: embed/dist-guard

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: talk2view-wheel
          path: wheel

      # Slicer's Python is 3.12: install the wheel and httpx for it into a directory the
      # driver puts on sys.path, so Slicer's own site-packages stay untouched.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install talk2view for Slicer's Python
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-out
          python -m pip install --target "$T2V_GUARD_SITE" wheel/talk2view-*.whl

      - name: Restore the Slicer package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .slicer-cache
          key: slicer-${{ matrix.label }}-r${{ env.SLICER_REVISION }}-${{ matrix.sha512 }}

      - name: Download and verify the Slicer package
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p .slicer-cache
          rm -f ".slicer-cache/$ARCHIVE.part"
          if [ ! -f ".slicer-cache/$ARCHIVE" ]; then
            # --retry-all-errors: a dropped connection mid-file happens with this host. No
            # `-C -`: it answers every Range request with the whole file, so retries start over.
            curl -fL --connect-timeout 30 --retry 5 --retry-all-errors --retry-delay 10 \
              -o ".slicer-cache/$ARCHIVE.part" "$SLICER_URL"
            # Verified before it is given the cached name, so a truncated download can
            # never be saved to the cache and re-served to later runs.
            echo "$SLICER_SHA512  .slicer-cache/$ARCHIVE.part" | sha512sum -c -
            mv ".slicer-cache/$ARCHIVE.part" ".slicer-cache/$ARCHIVE"
          fi
          # Again for a cache hit: nothing is unpacked or run before this line passes.
          echo "$SLICER_SHA512  .slicer-cache/$ARCHIVE" | sha512sum -c -

      # ── Linux ──
      - name: Install the libraries Slicer and QtWebEngine need (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri \
            libglu1-mesa libpulse-mainloop-glib0 libnss3 libasound2 qt5dxcb-plugin libsm6 \
            libgl1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 \
            libxcomposite1 libxcursor1 libxdamage1 libxrandr2 libxtst6 libxi6 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0

      - name: Unpack Slicer (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/slicer"
          tar -xzf ".slicer-cache/$ARCHIVE" --strip-components=1 -C "$RUNNER_TEMP/slicer"
          test -x "$RUNNER_TEMP/slicer/Slicer"
          test -x "$RUNNER_TEMP/slicer/bin/SlicerApp-real"
          # Diagnostics only, never fatal: a missing shared library is the usual
          # reason for a silent start failure, and this names it in the log. The
          # xcb platform plugins are included because Qt's "Could not load the Qt
          # platform plugin" error does not name the library that is missing.
          set +e +o pipefail
          for exe in "$RUNNER_TEMP/slicer/bin/SlicerApp-real" \
              $(find "$RUNNER_TEMP/slicer" -type f \( -name QtWebEngineProcess -o -name 'libqxcb*.so' \)); do
            echo "ldd $exe"
            # --launch runs ldd with Slicer's library path; it needs no display.
            out=$(timeout 60 "$RUNNER_TEMP/slicer/Slicer" --launch /usr/bin/ldd "$exe" 2>&1); rc=$?
            # "nothing missing" only when ldd really ran: its output has "=>" lines.
            if printf '%s\n' "$out" | grep -q " => "; then
              printf '%s\n' "$out" | grep "not found" || echo "  nothing missing"
              [ "$rc" -eq 0 ] || echo "  (exit $rc)"
            else
              echo "  ldd did not run (exit $rc). Output:"
              printf '%s\n' "$out" | tail -n 20 | sed 's/^/    /'
            fi
          done
          exit 0

      - name: Run the guard inside Slicer (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Qt logs every plugin it tries to load, and why a load failed, into
          # slicer-stdout.log: this names the library behind "Could not load the Qt platform plugin".
          QT_DEBUG_PLUGINS: "1"
        run: |
          set -uo pipefail
          # The default shell is `bash -e`: catch the exit code with `||`, or a failing
          # Slicer would end this step before the code and logs are saved.
          code=0
          timeout -k 15 480 \
            xvfb-run -a -s "-screen 0 1280x1024x24" \
            "$RUNNER_TEMP/slicer/Slicer" --testing --no-splash \
            --python-script "$GITHUB_WORKSPACE/embed/guard/slicer_guard_run.py" \
            > ci-out/slicer-stdout.log 2>&1 || code=$?
          echo "$code" > ci-out/slicer-exit-code.txt
          echo "Slicer exited with $code"
          # Slicer's output carries the page's console and the driver's log, both of which
          # can hold text from the page: no line of it may act as a workflow command.
          token=$(python -c "import secrets; print(secrets.token_hex(16))")
          echo "::stop-commands::$token"
          tail -n 40 ci-out/slicer-stdout.log || true
          echo "::$token::"
          # Slicer's own log dir: QDir::tempPath() + "/Slicer-" + $USER (empty when unset).
          cp "${TMPDIR:-/tmp}/Slicer-${USER:-}"/*.log ci-out/ 2>/dev/null || true

      # ── Windows ──
      - name: Install Slicer silently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:GITHUB_WORKSPACE ".slicer-cache\$env:ARCHIVE"
          # NSIS: /S = silent, /D=<dir> must be LAST and must not be quoted.
          $p = Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\Slicer' -PassThru
          $null = $p.Handle   # without this, ExitCode is empty after the process ends
          if (-not $p.WaitForExit(15 * 60 * 1000)) { $p.Kill(); throw 'the installer did not finish in 15 minutes' }
          Write-Host "installer exit code: $($p.ExitCode)"
          if (-not (Test-Path 'C:\Slicer\Slicer.exe')) {
            Write-Host 'Slicer.exe is missing after /S; falling back to unpacking the NSIS archive with 7-Zip'
            & 'C:\Program Files\7-Zip\7z.exe' x $installer '-oC:\Slicer' -y | Select-Object -Last 3
            Write-Host "7-Zip exit code: $LASTEXITCODE (1 = warnings only)"
          }
          if (-not (Test-Path 'C:\Slicer\Slicer.exe')) { throw 'C:\Slicer\Slicer.exe does not exist' }
          if (-not (Test-Path 'C:\Slicer\bin\SlicerApp-real.exe')) { throw 'C:\Slicer\bin\SlicerApp-real.exe does not exist' }
          # The two checks above are the verdict. Without this, the runner would
          # end the step with 7-Zip's exit code, and a warning (1) would fail it.
          exit 0

      - name: Put Mesa llvmpipe next to SlicerApp-real.exe (Windows has no GPU)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          MESA_VERSION: "26.2.0"
          MESA_SHA256: dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          curl.exe -fL --connect-timeout 30 --retry 5 --retry-all-errors --retry-delay 10 -o $archive "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          if ($hash -ne $env:MESA_SHA256) { throw "Mesa archive hash mismatch: $hash" }
          $dest = Join-Path $env:RUNNER_TEMP 'mesa'
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$dest" 'x64\opengl32.dll' 'x64\libgallium_wgl.dll' -y | Select-Object -Last 3
          # ONLY these two: the archive's libEGL/libGLESv2 would overwrite Qt's ANGLE copies.
          Copy-Item "$dest\x64\opengl32.dll", "$dest\x64\libgallium_wgl.dll" -Destination 'C:\Slicer\bin' -Force
          Get-ChildItem 'C:\Slicer\bin\opengl32.dll', 'C:\Slicer\bin\libgallium_wgl.dll' | Format-Table Name, Length

      - name: Run the guard inside Slicer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        env:
          GALLIUM_DRIVER: llvmpipe
          QT_OPENGL: desktop
        run: |
          New-Item -ItemType Directory -Force -Path $env:T2V_GUARD_OUT | Out-Null
          $script = Join-Path $env:GITHUB_WORKSPACE "embed\guard\slicer_guard_run.py"
          try {
            # Slicer.exe is a GUI-subsystem launcher: wait on its handle.
            $p = Start-Process -FilePath 'C:\Slicer\Slicer.exe' -ArgumentList '--testing', '--no-splash', '--python-script', "`"$script`"" -PassThru
            $null = $p.Handle
            if ($p.WaitForExit(480 * 1000)) { $code = $p.ExitCode } else { taskkill /F /T /PID $p.Id | Out-Null; $code = 124 }
          } catch {
            # Slicer could not be started (or waited on): say why, then save the evidence like any other run.
            $code = 'start-failed'
            $_ | Out-String | Set-Content -Path (Join-Path $env:T2V_GUARD_OUT 'driver-start-error.txt')
            Write-Host "Slicer did not start: $($_.Exception.Message)"
          }
          # The launcher's children can outlive a kill; never leave one behind.
          Get-Process SlicerApp-real, QtWebEngineProcess -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Set-Content -Path (Join-Path $env:T2V_GUARD_OUT 'slicer-exit-code.txt') -Value $code
          Write-Host "Slicer exited with $code"
          # Slicer's own log dir. The GUI launcher has no stdout, so on a crash, a kill or a
          # failed start this is the only record Slicer leaves.
          Copy-Item (Join-Path $env:TEMP 'Slicer\*.log') -Destination $env:T2V_GUARD_OUT -ErrorAction SilentlyContinue
          exit 0

      # ── Both ──
      - name: Judge the run and write the job summary
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -uo pipefail
          judged=0
          # The report quotes the page. The judge already makes it inert; this makes sure.
          token=$(python -c "import secrets; print(secrets.token_hex(16))")
          echo "::stop-commands::$token"
          python embed/guard/guard_judge.py --out ci-out --label "$T2V_GUARD_LABEL" \
            --expect-chromium "$T2V_GUARD_EXPECT" --summary "$GITHUB_STEP_SUMMARY" || judged=$?
          echo "::$token::"
          code=$(tr -d '[:space:]' < ci-out/slicer-exit-code.txt 2>/dev/null || echo missing)
          echo "Slicer exit code: $code, judge: $judged"
          {
            echo ""
            echo "Slicer exit code: \`$code\` (0 pass, 1 judged fail, 3 no results in time, 4 driver error, 5 Qt loop wedged; 124/137 killed by the time limit)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$judged" -ne 0 ] || [ "$code" != "0" ]; then exit 1; fi

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-${{ matrix.label }}
          path: ci-out
          if-no-files-found: warn
          retention-days: 14
