name: Publish to PyPI

# Manual, deliberate publishes (workflow_dispatch) and tagged GitHub Releases.
# Publishing uses PyPI Trusted Publishing (OIDC) — no long-lived token — and is
# gated behind the `pypi` environment, so it requires a manual approval in the
# repository's Environments settings before the upload runs.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Requires a one-time PyPI "pending publisher" for the Talk2View org:
    #   project=talk2view, owner=Talk2View, repo=talk2view-python,
    #   workflow=publish.yml, environment=pypi
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
