name: Publish to PyPI

# Publishing ships whatever version is committed on `main`, and nothing else. The version
# bump is an ordinary pull request that somebody reviewed, so the artifact that reaches
# PyPI was reviewed too.
#
# PyPI Trusted Publishing (OIDC): no long-lived token exists. PyPI trusts this file
# (publish.yml) in the `pypi` environment of Talk2View/talk2view-python, so renaming
# either breaks publishing until the trusted publisher on pypi.org is updated.
#
# The upload job runs in the `pypi` environment. It waits for an approval only if that
# environment has required reviewers (Settings -> Environments -> pypi).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publish from main, not ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: embed/package-lock.json

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Read the version, and refuse one that is already on PyPI
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "About to publish talk2view $version"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/talk2view/$version/json")
          if [ "$code" = 200 ]; then
            echo "::error::talk2view $version is already on PyPI. Bump the version in a pull request first."
            exit 1
          fi

      - name: Lint, type check and test
        run: |
          uv sync --all-extras --frozen
          uv run ruff check src/ tests/ scripts/
          uv run mypy src/
          uv run pytest -q

      - name: Build the chat page into src/talk2view/ui/static/
        working-directory: embed
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build (the sdist, then the wheel from it)
        run: |
          rm -rf dist
          uv build

      - name: The wheel and sdist carry the chat page
        run: python3 scripts/check_wheel_assets.py dist/*.whl dist/*.tar.gz

      - name: Metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - name: The built wheel installs and serves its page
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

      # What lands on PyPI is what partners install. List it, so whoever approves the
      # environment gate is approving something they can see.
      - name: What would be published
        run: |
          ls -l dist/
          python3 -m zipfile -l dist/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/talk2view/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish (Trusted Publishing, with attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  tag:
    name: Tag the published commit
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to push the release tag, after PyPI accepted the upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the published commit
        run: |
          version="${{ needs.build.outputs.version }}"
          git tag "v$version"
          git push origin "v$version"
