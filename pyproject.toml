[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talk2view"
version = "0.2.0b1"
description = "Talk2View Python SDK — add AI natural-language control to desktop and Python apps (beta)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "A2B Technology Corporation Pty Ltd" }]
keywords = ["talk2view", "ai", "agent", "sdk", "assistant"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://talk2view.com"
Documentation = "https://engine.talk2view.com/docs"
Repository = "https://github.com/Talk2View/talk2view-python"
Changelog = "https://github.com/Talk2View/talk2view-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/talk2view"]

[tool.hatch.build.targets.sdist]
include = ["src/talk2view", "README.md", "CHANGELOG.md", "LICENSE"]
