[build-system]
# hatchling 1.27 is the first release whose default core metadata (2.4) includes the
# PEP 639 License-Expression and License-File fields.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "talk2view"
version = "0.3.0"
description = "Python SDK for the Talk2View Platform — add AI-powered natural language control to any application."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "A2B Technology Corporation Pty Ltd" }]
keywords = ["talk2view", "ai", "agent", "sdk", "assistant", "3d-slicer", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://talk2view.com"
Documentation = "https://docs.talk2view.com"
Repository = "https://github.com/Talk2View/talk2view-python"
Issues = "https://github.com/Talk2View/talk2view-python/issues"
Changelog = "https://github.com/Talk2View/talk2view-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# apsw bundles a SQLite with FTS5, for hosts whose sqlite3 lacks it (talk2view.memory).
# apsw 3.54 needs Python 3.11+; on 3.10 the store uses sqlite3's FTS5 or its scan backend.
memory = ["apsw>=3.54; python_version >= '3.11'"]
dev = [
  "pytest>=7",
  "pytest-cov>=6.0",
  "pytest-httpserver>=1.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "pydantic>=2.0",
  "apsw>=3.54; python_version >= '3.11'",
]

[tool.hatch.build]
artifacts = ["src/talk2view/ui/static/**"]
# The chat page is git-ignored (.gitignore) and built from embed/. `artifacts`
# includes it anyway, in BOTH the sdist and the wheel: `uv build` and `pip install <sdist>`
# build the wheel from the sdist, so a wheel-only setting would drop the page there. Never
# `force-include` it: that double-adds in-package files. hatch_build.py refuses an archive
# without the page; scripts/check_wheel_assets.py checks the built archives in CI.

[tool.hatch.build.hooks.custom]
# hatch_build.py

[tool.hatch.build.targets.wheel]
packages = ["src/talk2view"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/talk2view",
  "/tests",
  "/contract",
  "/scripts",
  "/hatch_build.py",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[tool.ruff]
target-version = "py310"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]  # Allow assert and test passwords in tests

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["stress: opt-in concurrency probe, run with T2V_STRESS=1"]

[tool.coverage.run]
source = ["talk2view"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
